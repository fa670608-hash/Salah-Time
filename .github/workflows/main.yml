name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Firebase config (google-services.json)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
          elif [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          else
            echo "::error::google-services.json পাওয়া যায়নি (repo root এ রাখো, অথবা GOOGLE_SERVICES_JSON_B64 secret দাও)"
            exit 1
          fi

      - name: App icons
        run: bash scripts/make_icons.sh

      - name: Add home-screen widgets
        run: python3 scripts/patch_android.py

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salah-time-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
